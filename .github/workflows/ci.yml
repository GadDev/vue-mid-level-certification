name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Resolves the commit to diff against. Any failure to resolve one (new
      # branch's first push, unresolvable merge-base) falls back to a full run
      # rather than narrowing or skipping tests.
      - name: Resolve diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "full-run=true" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "full-run=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      # Anything outside these four directories (root config, lockfile, this
      # workflow file, etc.) can affect packages pnpm's own graph doesn't
      # model, so it forces a full run. New top-level directories are safe by
      # default: they trigger this fallback until added here deliberately.
      - name: Check for unscoped changes
        id: path-check
        if: steps.diff-base.outputs.full-run != 'true'
        env:
          BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -qvE '^(packages|solutions|shared|docs)/'; then
            echo "full-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "full-run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm sync:tests:check

      - name: Test solutions (affected-only when possible)
        env:
          FULL_RUN: ${{ steps.diff-base.outputs.full-run == 'true' || steps.path-check.outputs.full-run == 'true' }}
          BASE: ${{ steps.diff-base.outputs.base }}
        run: |
          if [ "$FULL_RUN" = "true" ]; then
            pnpm test:solutions
          else
            pnpm --filter "...[$BASE]" --filter "./solutions" --if-present test
          fi

      - run: pnpm build
      - run: pnpm docs:build
