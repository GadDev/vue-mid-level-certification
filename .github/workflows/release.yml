name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets changesets.yml's auto-tag job invoke this workflow directly. A tag
  # pushed with the default GITHUB_TOKEN does NOT start a new workflow run
  # (GitHub's loop-prevention for GITHUB_TOKEN-authored events), so relying
  # on the `push: tags` trigger alone would mean the auto-pushed tag silently
  # never triggers a release. workflow_call sidesteps that without needing a
  # PAT/App token, which would be a standing write-scoped credential.
  workflow_call:
    inputs:
      tag:
        description: Tag to release (e.g. v1.4.0). Falls back to github.ref_name when triggered by a tag push.
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Tags aren't required to be pushed from a commit that CI already validated
  # (e.g. a manually created tag), so this checks the "test" status (the
  # aggregator job in ci.yml) actually succeeded for this exact SHA before
  # publishing a release from it. Polls rather than checking once: the
  # auto-tag job in changesets.yml pushes the tag from the same push event
  # that triggers ci.yml, so the "test" check-run is frequently still
  # in_progress at the moment this job starts.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 80); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "test")]')
            count=$(echo "$runs" | jq 'length')

            if [ "$count" -gt 0 ]; then
              status=$(echo "$runs" | jq -r '.[0].status')
              conclusion=$(echo "$runs" | jq -r '.[0].conclusion')

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI 'test' check succeeded for $SHA."
                  exit 0
                fi
                echo "::error::CI 'test' check for commit $SHA completed with conclusion '$conclusion' — refusing to publish a release from it."
                exit 1
              fi
            fi

            echo "Waiting for CI 'test' check on $SHA to complete ($i/80)..."
            sleep 15
          done

          echo "::error::Timed out waiting for the CI 'test' check on commit $SHA to complete."
          exit 1

  release:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # github.ref_name is the tag name when triggered by `push: tags`, but
      # is the branch name (e.g. "main") under workflow_call — inputs.tag
      # carries the real tag name in that case instead.
      - name: Extract section from CHANGELOG.md
        id: changelog
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          notes="$(awk -v ver="$version" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, ver) > 0) { found=1; next }
              next
            }
            found { print }
          ' meta/release/CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/meta/release/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned to v2.6.2's commit SHA — this action has contents:write, so
      # it isn't tracked by a mutable tag. tag_name is explicit because this
      # action otherwise infers it from GITHUB_REF, which is wrong under
      # workflow_call (see the changelog-extraction step above).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
