name: Changesets Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      # Pinned to v1.9.0's commit SHA — this action has contents:write and
      # pull-requests:write, so it isn't tracked by a mutable tag.
      - uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs independently of the `version` job above — it doesn't care whether
  # this push opened/updated a version PR, only whether this exact push
  # changed @practice/release's version (i.e. this is the push that merged
  # a "chore: version packages" PR). When it did, it tags the commit so
  # release.yml runs without a human pushing the tag by hand.
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag if @practice/release's version changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          FILE=meta/release/package.json
          NEW_VERSION=$(jq -r .version "$FILE")

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No resolvable previous commit for this push — skipping auto-tag."
            exit 0
          fi

          OLD_VERSION=$(git show "$BEFORE:$FILE" 2>/dev/null | jq -r .version 2>/dev/null || echo "")

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION) — nothing to tag."
            exit 0
          fi

          TAG="v$NEW_VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
