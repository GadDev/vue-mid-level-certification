name: Changesets Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      # Pinned to v1.9.0's commit SHA — this action has contents:write and
      # pull-requests:write, so it isn't tracked by a mutable tag.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs independently of the `version` job above — it doesn't care whether
  # this push opened/updated a version PR, only whether this exact push
  # changed @practice/release's version (i.e. this is the push that merged
  # a "chore: version packages" PR). When it did, it tags the commit so
  # release.yml runs without a human pushing the tag by hand.
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag if @practice/release's version changed
        id: tag
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          FILE=meta/release/package.json
          NEW_VERSION=$(jq -r .version "$FILE")

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No resolvable previous commit for this push — skipping auto-tag."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "$BEFORE:$FILE" 2>/dev/null | jq -r .version 2>/dev/null || echo "")

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION) — nothing to tag."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v$NEW_VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  # A tag pushed with the default GITHUB_TOKEN (as tag-release does, above)
  # does not start a new workflow run on its own — GitHub's loop-prevention
  # for GITHUB_TOKEN-authored events blocks it. Calling release.yml directly
  # via workflow_call is what actually makes the release happen.
  trigger-release:
    needs: tag-release
    if: needs.tag-release.outputs.tagged == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-release.outputs.tag }}
