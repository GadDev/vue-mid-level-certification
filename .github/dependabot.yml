version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # vue-tsc and the docs test counter depend on the TypeScript 5 compiler API.
    # Upgrade TypeScript majors separately after those consumers are migrated.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vue-ecosystem:
        patterns:
          - "vue*"
          - "@vue/*"
          - "@vitejs/*"
          - "vite*"
          - "pinia"
          - "vue-router"
      tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vitest"
          - "jsdom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
